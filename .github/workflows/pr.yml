name: pull request
on:
  pull_request:

jobs:
  auth-tests:
    name: Authentication Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.9-alpine
        env:
          POSTGRES_USER: walls_test
          POSTGRES_PASSWORD: walls_test_fixture
          POSTGRES_DB: walls_auth_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U walls_test -d walls_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://walls_test:walls_test_fixture@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/walls_auth_test
      - run: npm run typecheck

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build --target app -t website .

  docker-build-migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build --target migrate -t website-migrate .

  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run format:check

  npm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build

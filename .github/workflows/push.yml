name: Release & Docker Push

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag to push"
        required: false
        default: "latest"

env:
  REGISTRY: cr.guneet.dev

jobs:
  format-check:
    name: Prettier Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check

  release:
    name: Semantic Release
    if: github.event_name == 'push'
    needs: format-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new-release: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v6
      - id: semantic
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-push:
    name: Docker Push
    needs: release
    if: needs.release.outputs.new-release == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=${{ needs.release.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/walls/app:latest
            ${{ env.REGISTRY }}/walls/app:${{ needs.release.outputs.version }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  docker-force-push:
    name: Docker Force Push
    needs: format-check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=${{ inputs.tag }}
          tags: ${{ env.REGISTRY }}/walls/app:${{ inputs.tag }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  docker-push-migrate:
    name: Docker Push (Migrate)
    needs: release
    if: needs.release.outputs.new-release == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/walls/migrate:latest
            ${{ env.REGISTRY }}/walls/migrate:${{ needs.release.outputs.version }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

  docker-force-push-migrate:
    name: Docker Force Push (Migrate)
    needs: format-check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/walls/migrate:${{ inputs.tag }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate
